name: DSH 邮件提醒

# GitHub 的 cron 会被降频（实测把 */5 拖成了两三小时才跑一次），
# 所以脚本不依赖"准时"，改成「过期未发就补发」，只在迟到上吃亏，不会漏。
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"      # 每小时一次，用来写心跳、保持仓库活跃
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dsh-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查并补发到点的提醒
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          REMINDERS_JSON: ${{ secrets.REMINDERS_JSON }}
        run: python send_due.py

      # 提交 sent.json / sent.log / 心跳；顺带让仓库保持"有活动"，
      # 否则 GitHub 会在 60 天无活动后自动停掉定时工作流。
      - name: 提交回执与心跳
        if: always()
        run: |
          git config user.name  "dsh-reminder-bot"
          git config user.email "dsh-reminder-bot@users.noreply.github.com"
          [ -f sent.log ] || touch sent.log
          [ -f sent.json ] || echo "[]" > sent.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "log $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "无变化，跳过提交"
          fi
